name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 内容门禁（必需文件 / AI 腔 / 红线词 / frontmatter）
        run: python3 check.py

      - name: 双端一致性（锚定秋夜分数）
        run: node test_web.js | grep -q "分数 91"

      - name: 校准冒烟（两群不重叠）
        run: python3 calibrate.py | grep -q "无重叠"

      - name: 文字校对（提醒式，只记不拦）
        run: python3 check_typos.py || true
