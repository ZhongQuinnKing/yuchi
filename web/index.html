<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>玉尺 · 量一量你的中文</title>
<meta name="description" content="玉尺：量中文的呼吸。把一段文字贴进来，量出句长节奏、套话密度与结构，指出哪里读起来不像人写的，并给到句子的改法。">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #2b2b2b; --sub: #6d675e; --jade: #3f6f60; --jade-soft: #eef4f1;
    --paper: #faf8f4; --line: #e6e0d6; --warn: #a4553f;
  }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink); background: var(--paper); line-height: 1.8;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 20px 64px; }
  header { padding: 56px 0 8px; text-align: center; }
  h1 { font-family: "Songti SC", "STSong", "SimSun", serif;
       font-size: 44px; letter-spacing: 14px; text-indent: 14px; font-weight: 600; }
  .epigraph { font-family: "Songti SC", serif; color: var(--jade);
              font-size: 15px; letter-spacing: 2px; margin-top: 10px; }
  .epigraph span { color: var(--sub); font-size: 12px; letter-spacing: 0; margin-left: 6px; }
  .lead { text-align: center; color: var(--sub); font-size: 14px; margin: 18px 0 26px; }
  textarea {
    width: 100%; min-height: 190px; padding: 18px 20px; font-size: 15.5px;
    font-family: inherit; line-height: 1.9; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    resize: vertical; outline: none;
  }
  textarea:focus { border-color: var(--jade); }
  .mode-switch { display: flex; margin-bottom: 12px; }
  .mode { border: 1px solid var(--jade); background: transparent; color: var(--jade);
          border-radius: 0; font-size: 14px; letter-spacing: 1px; padding: 8px 22px; }
  .mode:first-child { border-radius: 8px 0 0 8px; }
  .mode:last-child { border-radius: 0 8px 8px 0; border-left: none; }
  .mode.on { background: var(--jade); color: #fff; }
  .btns { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  button {
    padding: 11px 26px; font-size: 15px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--jade); background: var(--jade); color: #fff;
    font-family: inherit; letter-spacing: 3px;
  }
  button.ghost { background: transparent; color: var(--jade); letter-spacing: 1px; }
  button:hover { opacity: .88; }
  #result { margin-top: 34px; }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 26px 28px; margin-bottom: 18px;
  }
  .score-row { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .score { font-size: 52px; font-weight: 700; color: var(--jade);
           font-family: "Songti SC", serif; }
  .verdict { font-size: 16px; color: var(--ink); }
  .sub { color: var(--sub); font-size: 13px; }
  h3 { font-size: 14px; color: var(--jade); letter-spacing: 3px; font-weight: 600;
       margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .kv { display: flex; justify-content: space-between; font-size: 14px;
        padding: 4px 0; color: #444; gap: 12px; }
  .kv b { font-weight: 600; color: var(--ink); }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px;
             color: var(--sub); margin: 2px 0; }
  .bar-row .idx { width: 26px; text-align: right; flex: none; }
  .bar { height: 13px; background: var(--jade-soft); border-radius: 3px; flex: none; }
  .bar i { display: block; height: 100%; background: var(--jade); border-radius: 3px;
           opacity: .75; }
  .bar-row .len { width: 34px; flex: none; }
  .bar-row .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                  color: #999; }
  ol.tips { padding-left: 22px; font-size: 14.5px; }
  ol.tips li { margin: 8px 0; }
  .kicker { font-size: 13.5px; color: var(--warn); }
  footer { text-align: center; color: var(--sub); font-size: 12.5px;
           margin-top: 40px; line-height: 2; }
  footer a { color: var(--jade); text-decoration: none; }
</style>

<body>
<div class="wrap">

<header>
  <h1>玉尺</h1>
  <p class="epigraph">「仙人持玉尺，度君多少才。」<span>——旧题李白《上清宝鼎诗》</span></p>
  <p class="lead">把一段中文贴进来，玉尺量它的呼吸。文章、帖子、AI 写的字，都行。<br>
     量的是节奏，不是词表；给的是改法，不是形容词。</p>
</header>

<div class="mode-switch">
  <button class="mode on" data-mode="prose">文章</button>
  <button class="mode" data-mode="poem">诗</button>
</div>
<textarea id="text" placeholder="在这里粘贴文字……（文章：两段以上更准；诗：一行一句）"></textarea>
<div class="btns">
  <button id="run">量　一　量</button>
  <button class="ghost" id="demo">试一段示例</button>
  <button class="ghost" id="copy" style="display:none">复制报告</button>
</div>

<div id="result"></div>

<footer>
  玉尺不测 AI 率，只量呼吸。检测率是检测器的事，写得像人，是写作的事。<br>
  字句长短相间，读来才有气。<br>
  <span style="opacity:.75">命令行还有：诗 · 词对谱 · 曲 · 联 · 赋，和可保存的 HTML 报告卡。</span>
</footer>

</div>

<script>
/* ================= 分析器（与 yuchi.py v1 同源逻辑） ================= */
const SENT_END = /(?<=[。！？；!?;])/;
const CLAUSE_SPLIT = /[，、,；;]+/;
const PUNCT = new Set(Array.from('，。！？；：、「」『』（）《》〈〉【】…—·～,.!?;:()"\'“”‘’ \t'));
const GLUE_WORDS = ["一方面","另一方面","综上所述","值得注意的是","总而言之","总的来说",
  "首先","其次","最后","此外","因此","然而","但是","而且","不容忽视","在当今","随着",
  "让我们","值得一提的是","需要指出","可以说","无疑","显而易见","众所周知","与此同时","更重要的是"];
const ENUM_WORDS = ["首先","其次","再次","最后，","第一，","第二，","第三，","其一","其二",
  "一方面","另一方面","此外","与此同时","除此之外"];
const SUM_WORDS = ["综上所述","总而言之","由此可见","总的来说","总之","让我们"];
/* 虚词与空夸词：程度副词、空动词、无刻度的夸赞 */
const VAGUE_WORDS = ["非常","十分","极其","相当","格外","尤为","堪称","备受","深受",
  "无比","深深","大大","充分","高度","至关重要","意义重大",
  "进一步提升","全面优化","不断完善","显著提升","有效改善"];
const STRUCT_ONLY = new Set([...GLUE_WORDS, ...ENUM_WORDS, ...SUM_WORDS]);
/* 统计词频前先剥离引文：成对引号（含直引号）与 markdown 引用块行 */
const QUOTE_STRIP = /[“][^“”]*[”]|[「][^「」]*[」]|[『][^『』]*[』]|["][^"]{1,120}["]/g;
const QUOTE_BLOCK = /^[ \t]*> .*$/gm;
const CONFIG = {
  /* 满分点≈人类语料 p75、零点≈AI 语料中位（2026-10-09 重标） */
  sent_cv: [0.55, 0.18], clause_cv: [0.55, 0.30], flat_run: [2, 6],
  short_per200: [1.5, 0.2], glue_density: [0.5, 3.0], dash_density: [0.6, 3.0],
  vague_density: [0.2, 1.0],
  struct_score: [0.0, 6.0], para_cv: [0.58, 0.20],
};
const WEIGHTS = { rhythm: 0.40, density: 0.25, struct: 0.20, para: 0.15 };

function hanzi(s) { let n = 0; for (const c of s) if (c >= "一" && c <= "鿿") n++; return n; }
function mean(a) { return a.reduce((x, y) => x + y, 0) / a.length; }
function pstd(a) { const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) * (x - m), 0) / a.length); }
function cv(a) { if (a.length < 2) return 0; const m = mean(a); return m ? pstd(a) / m : 0; }
function soft(a, b, x) { if (a === b) return 1; return Math.max(0, Math.min(1, (x - b) / (a - b))); }
function count(t, w) { return t.split(w).length - 1; }

const PARA_END = new Set(['。','！','？','；','…','”','’','」','』','）',')']);
function splitParagraphs(text) {
  /* 一行即一段；行尾无句末标点的行与下一行接续（网页复制硬换行不算多段） */
  const lines = text.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
  const paras = [];
  let buf = '';
  for (const l of lines) {
    buf = buf ? buf + l : l;
    if (PARA_END.has(Array.from(l).pop())) { paras.push(buf); buf = ''; }
  }
  if (buf) paras.push(buf);
  return paras;
}
function splitSentences(paras) {
  const out = [];
  for (const p of paras) for (const line of p.split('\n')) {
    const l = line.trim(); if (!l || l.startsWith('#')) continue;
    for (const t of l.split(SENT_END)) if (t.trim()) out.push(t.trim());
  }
  return out;
}
function splitClauses(sents) {
  const out = [];
  for (const s of sents) for (let c of s.split(CLAUSE_SPLIT)) {
    c = c.trim(); if (!c) continue;
    const bare = c.replace(/[。！？；：、，,.;: ]/g, '');
    if (STRUCT_ONLY.has(bare) && hanzi(c) <= 5) continue;
    out.push(c);
  }
  return out;
}
function longestFlatRun(lens, spread = 8) {
  const n = lens.length; if (n < 3) return [0, 0];
  let bl = 0;
  for (let i = 0; i < n; i++) {
    let lo = lens[i], hi = lens[i], j = i;
    while (j < n && Math.max(hi, lens[j]) - Math.min(lo, lens[j]) <= spread) {
      hi = Math.max(hi, lens[j]); lo = Math.min(lo, lens[j]); j++;
    }
    if (j - i > bl) bl = j - i;
  }
  return [bl, bl / n];
}

function analyze(text) {
  const paras = splitParagraphs(text);
  const allText = paras.join('\n');
  const statText = allText.replace(QUOTE_BLOCK, '').replace(QUOTE_STRIP, '');
  let sents = splitSentences(paras);
  sents = sents.filter(s => hanzi(s) > 0);
  const lens = sents.map(hanzi);
  const clauses = splitClauses(sents);
  const clens = clauses.map(hanzi).filter(n => n > 0);
  const total = lens.reduce((a, b) => a + b, 0);
  const r = { n: lens.length, lens, sents, total, nClause: clens.length, clens };

  r.avg = lens.length ? mean(lens) : 0;
  r.std = lens.length >= 2 ? pstd(lens) : 0;
  r.cv = cv(lens);
  r.max = lens.length ? Math.max(...lens) : 0;
  r.min = lens.length ? Math.min(...lens) : 0;
  r.clauseCv = cv(clens);
  r.clauseAvg = clens.length ? mean(clens) : 0;
  const [flatN, flatPct] = longestFlatRun(lens);
  r.flatN = flatN; r.flatPct = flatPct;
  r.shortCount = lens.filter(n => n <= 12).length;
  r.shortPer200 = total ? r.shortCount / total * 200 : 0;

  const glueHits = GLUE_WORDS.map(w => [w, count(statText, w)]).filter(x => x[1]);
  const glueTotal = glueHits.reduce((s, x) => s + x[1], 0);
  r.glueDensity = total ? glueTotal / total * 100 : 0;
  r.glueHits = glueHits.sort((a, b) => b[1] - a[1]);

  /* "十分"单独走正则：排除"四十分钟"这类跨词误匹配 */
  const vagueTotal = VAGUE_WORDS.filter(w => w !== "十分").reduce((s, w) => s + count(statText, w), 0)
    + ((statText.match(/十分(?!钟)/g) || []).length);
  r.vagueDensity = total ? vagueTotal / total * 100 : 0;

  const enumN = ENUM_WORDS.reduce((s, w) => s + count(statText, w), 0);
  const sumN = SUM_WORDS.reduce((s, w) => s + count(statText, w), 0);
  r.enumN = enumN; r.sumN = sumN; r.structRaw = enumN + 2 * sumN;
  r.struct = (enumN >= 2 && sumN >= 1) ? "总分总（清单式）"
           : enumN >= 2 ? "清单式列举" : sumN >= 1 ? "结尾总结式" : "自然推进";

  r.dash = count(statText, "——");
  r.dashDensity = total ? r.dash / total * 100 : 0;
  r.semi = count(statText, "；") + count(statText, ";");

  const plens = paras.map(hanzi);
  r.nPara = paras.length;
  r.paraCv = plens.length >= 3 ? cv(plens) : null;

  const sRhythm = 0.40 * soft(...CONFIG.sent_cv, r.cv)
                + 0.25 * soft(...CONFIG.clause_cv, r.clauseCv)
                + 0.15 * soft(CONFIG.flat_run[0], CONFIG.flat_run[1], r.flatN)
                + 0.20 * soft(...CONFIG.short_per200, r.shortPer200);
  const sDensity = 0.45 * soft(...CONFIG.glue_density, r.glueDensity)
                 + 0.20 * soft(...CONFIG.dash_density, r.dashDensity)
                 + 0.35 * soft(...CONFIG.vague_density, r.vagueDensity);
  const sStruct = soft(...CONFIG.struct_score, r.structRaw);
  const sPara = r.paraCv !== null ? soft(...CONFIG.para_cv, r.paraCv) : 0.5;

  r.score = Math.max(0, Math.min(100, Math.round(100 * (
    WEIGHTS.rhythm * sRhythm + WEIGHTS.density * sDensity +
    WEIGHTS.struct * sStruct + WEIGHTS.para * sPara))));
  const fm = detectForm(text);
  r.form = fm.form; r.formItemRatio = fm.ratio;
  return r;
}

/* 文体识别：条目/结构化文本（通知、纪要、清单、模板）不按散文口径打分；
   # 行是注释/标题，整个剔除 */
const ITEM_LINE = /^\s*(?:[一二三四五六七八九十]+[、.．]|[0-9]+[.、)）]|（[一二三四五六七八九十0-9]+）|[-*•·])/;
const TABLE_LINE = /^\s*\|/;
function detectForm(text) {
  const lines = text.split("\n").filter(l => l.trim() && !l.trim().startsWith("#"));
  if (!lines.length) return { form: "prose", ratio: 0 };
  const itemN = lines.filter(l => ITEM_LINE.test(l)).length;
  const tableN = lines.filter(l => TABLE_LINE.test(l)).length;
  const ratio = itemN / lines.length;
  return (ratio >= 0.25 || tableN > 0)
    ? { form: "structured", ratio } : { form: "prose", ratio };

function poemRhymes(r) {

function toneOf(ch) {
  const t = TONE_TABLE ? TONE_TABLE[ch] : undefined;
  if (t === "平") return "平";
  if (t === "仄") return "仄";
  if (t === "多") return "通";
  return "？";
}
function isRegulated(lens) {
  return lens.length > 0 && new Set(lens).size === 1
    && (lens[0] === 5 || lens[0] === 7) && lens.length % 4 === 0;
}
function annotateTones(lines) {
  return lines.map(l => Array.from(l)
    .filter(c => c >= "一" && c <= "鿿").map(toneOf).join(""));
}
function toneNotes(seq) {
  const out = [], arr = Array.from(seq);
  let i = 0;
  while (i < arr.length) {
    let j = i;
    while (j < arr.length && arr[j] === arr[i]) j++;
    const run = j - i, ch = arr[i];
    if ((ch === "平" || ch === "仄") && run >= 4)
      out.push(`第 ${i + 1} 到 ${j} 字连着 ${run} 个${ch}声`
               + (ch === "仄" ? "，念起来发紧" : "，念起来发飘"));
    i = j;
  }
  return out;
}

/* 诗模式：诗按行读。体检为主、不打总分——诗的好坏留给作者。 */
function analyzePoem(text) {
  const raw = text.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
  const pairs = [];
  for (const l of raw) { const n = hanzi(l); if (n > 0) pairs.push([l, n]); }
  const lines = pairs.map(p => p[0]);
  const lens = pairs.map(p => p[1]);
  const r = { n: lens.length, lens, lines };
  r.avg = lens.length ? mean(lens) : 0;
  r.cv = cv(lens);
  r.max = lens.length ? Math.max(...lens) : 0;
  r.min = lens.length ? Math.min(...lens) : 0;

  r.flatRun = 0;
  if (lens.length) {
    let cur = 1, best = 1;
    for (let i = 1; i < lens.length; i++) {
      cur = Math.abs(lens[i] - lens[i - 1]) <= 1 ? cur + 1 : 1;
      best = Math.max(best, cur);
    }
    r.flatRun = best;
  }
  r.shortN = lens.filter(n => n <= 6).length;

  const tails = [];
  for (const l of lines) {
    const s = l.replace(/[，。！？；：、,.!?;:…—\s]+$/g, '');
    if (s) tails.push(Array.from(s).pop());
  }
  r.tails = tails;
  r.adjRep = 0;
  for (let i = 1; i < tails.length; i++) if (tails[i] === tails[i - 1]) r.adjRep++;

  const sections = [];
  for (const sec of text.split(/\n\s*\n/)) {
    const n = sec.split('\n').filter(l => l.trim() && !l.trim().startsWith('#')).length;
    if (n) sections.push(n);
  }
  r.sections = sections;

  const issues = [];
  const reg = isRegulated(lens);  // 近体诗格律使然，不适用豆腐块与行长检测
  if (r.flatRun >= 3 && !reg)
    issues.push(`连续 ${r.flatRun} 行长度几乎一样，像豆腐块。挑一行动手：要么砍掉一半，要么拉长。`);
  if (r.n >= 5 && r.cv < 0.28 && !reg)
    issues.push("行长太平，全诗缺少起伏。自由诗的自由，一半在行长上。");
  if (r.adjRep >= 2)
    issues.push(`有 ${r.adjRep} 处相邻行行尾同字，读起来像打嗝；除非是刻意的复沓，改掉。`);
  if (r.n >= 6 && r.shortN === 0)
    issues.push("没有一行短过七字。给诗留几口气短的。");
  r.issues = issues;
  return r;
}

  L.push(`<div class="card">
    <div class="score-row"><span class="score" style="font-size:34px">诗诊</span></div>
    <div class="kv"><span>行数</span><b>${r.n}　节 ${r.sections.length}（各节 ${r.sections.join('/')} 行）</b></div>
    <div class="kv"><span>平均行长</span><b>${r.avg.toFixed(0)} 字</b></div>
    <div class="kv"><span>行长变异系数</span><b>${r.cv.toFixed(2)}</b></div>
    <div class="kv"><span>最长 / 最短</span><b>${r.max} / ${r.min}</b></div>
    <div class="kv"><span>短行（≤6 字）</span><b>${r.shortN} 行</b></div>
  </div>`);

  L.push(`<div class="card"><h3>行 长 图</h3>`);
  const maxLen = Math.max(...r.lens, 1);
  r.lens.forEach((n, i) => {
    const w = Math.max(3, Math.round(n / maxLen * 300));
    const s = (r.lines[i] || "").slice(0, 18);
    L.push(`<div class="bar-row"><span class="idx">${i + 1}</span>
      <span class="bar" style="width:${w}px"><i style="width:100%"></i></span>
      <span class="len">${n}</span><span class="txt">${esc(s)}</span></div>`);
  });
  L.push(`</div>`);

  L.push(`<div class="card"><h3>行 尾</h3>
    <div class="sub">${r.tails.join('／')}</div>
    <div class="kv"><span>相邻同尾</span><b>${r.adjRep} 处</b></div></div>`);

  let extra = [];
  if (isRegulated(r.lens)) {
    const seqs = annotateTones(r.lines);
    const rows = seqs.map((seq, i) =>
      `<div class="bar-row"><span class="idx">${i + 1}</span>` +
      `<span class="txt" style="color:#2b2b2b">${seq}</span>` +
      `<span class="txt">${esc((r.lines[i] || "").slice(0, 18))}</span></div>`).join("");
    L.push(`<div class="card"><h3>平 仄 标 注</h3>
      <div class="sub">平／仄／通＝多音；？＝平仄表未收</div>${rows}</div>`);
    seqs.forEach((seq, i) => toneNotes(seq).forEach(nt => extra.push(`第 ${i + 1} 行：${nt}`)));

    // 韵脚（偶数句）——与命令行版同规则：取去标点后的行尾字，查平水韵
    const rh = poemRhymes(r);
    L.push(`<div class="card"><h3>韵 脚（偶数句）</h3>` +
      rh.rows.map(x => `<div class="kv"><span>第 ${x.i} 句尾「${esc(x.ch)}」</span><b>${esc(x.yun)}</b></div>`).join("") +
      `</div>`);
    if (!rh.same)
      extra.push("偶数句的韵脚不在同一韵部。近体诗偶句要押韵，看看要不要调。");
  }
  const allNotes = r.issues.concat(extra);
  L.push(`<div class="card"><h3>体 检（判断留给你）</h3>
    ${allNotes.length
      ? `<ol class="tips">${allNotes.map(t => `<li>${esc(t)}</li>`).join('')}</ol>`
      : `<p class="sub">没查出明显的问题。真要说：把最重的那一行往前提一提，看看气顺不顺。</p>`}
  </div>`);
  L.push(`<p class="kicker">诗不打分——诗的好坏留给你，尺子只报数。</p>`);
  return L.join('');
}

function toPoemText(r) {
  const L = ["玉尺 · 诗诊", `行数 ${r.n}　节 ${r.sections.length}　平均 ${r.avg.toFixed(0)} 字　CV ${r.cv.toFixed(2)}`,
             `行尾：${r.tails.join('／')}（相邻同尾 ${r.adjRep} 处）`];
  if (r.issues.length) { L.push("体检："); r.issues.forEach((t, i) => L.push(`${i + 1}. ${t}`)); }
  else L.push("体检：没查出明显的问题。");
  return L.join("\n");
}

/* 人类参考样本的分数分布（与命令行端同一张表，语料或阈值变动后两边同换） */
const PERCENTILE_TABLE = [59, 64, 71, 72, 74, 76, 78, 79, 80, 82,
                          84, 85, 86, 88, 90, 91, 92, 93, 94, 98];
function percentileOf(score) {
  const below = PERCENTILE_TABLE.filter(v => v < score).length;
  const equal = PERCENTILE_TABLE.filter(v => v === score).length;
  return Math.round((below + 0.5 * equal) / PERCENTILE_TABLE.length * 100);
}

function verdict(score) {
  if (score >= 80) return "「有气」——长短相间，读起来有呼吸。";
  if (score >= 60) return "「气弱」——能读，但节奏偏平，缺短句的顿挫。";
  if (score >= 40) return "「气滞」——句式均匀、套话偏多，有较重的机器感。";
  return "「无气」——句句等长、连接词铺路，是典型的生成腔。";
}

function makeTips(r) {
  const tips = [];
  if (r.flatN >= 4)
    tips.push(`全篇有一段 ${r.flatN} 句的平滑区，长度变化不到 8 字。挑其中最长的两句动手：一句拆成两句，一句砍到十字以内。`);
  if (r.cv < 0.30)
    tips.push("大句长短太齐。在长句群中间安插短句，让读者有换气的地方。");
  if (r.clauseCv < 0.35)
    tips.push("句内的逗号也走得均匀。长句内部掺进三五个字的短顿，呼吸就有了起伏。");
  if (r.glueDensity > 3)
    tips.push("连接词在替读者铺路。「因此」「然而」删一半，因果交给语序，转折交给短句。");
  if (r.structRaw >= 2)
    tips.push(`结构的骨架露出来了（${r.struct}）。把「首先其次最后」拆掉，让每段接着上一段的意思往下走，而不是平铺开清单。`);
  if (r.dashDensity > 1.5)
    tips.push("破折号在替你做语气的活。留最重的一处，其余改成句号。");
  if (r.shortPer200 < 0.8)
    tips.push("短句太少。每 200 字安插一句十来个字的短句，让长句有落点。");
  if (!tips.length)
    tips.push("节奏健康。真要说：把最好的句子往前提一句，开头会更峻峭。");
  return tips;
}

/* ================= 界面 ================= */
const $ = (id) => document.getElementById(id);
const DEMO = "在当今快速发展的现代社会中，人际关系的重要性正在日益凸显。一方面，良好的人际关系能够为我们提供重要的情感支持和实际帮助，让我们在困难时刻感受到温暖与力量。另一方面，不良的人际关系可能会给我们带来诸多困扰和精神压力，甚至影响到我们的身心健康和工作效率。值得注意的是，建立良好的人际关系需要我们在日常生活中持续投入时间和精力，这并不是一蹴而就的事情。首先，我们应该学会真诚地对待他人，以心换心，用真心去换取他人的信任与尊重。其次，我们需要掌握有效的沟通技巧，学会倾听他人的想法和感受，避免不必要的误解和冲突。最后，我们要保持积极乐观的心态，用正能量去感染身边的每一个人，营造和谐友善的氛围。综上所述，人际关系是一门需要终身学习的艺术，它既需要我们付出真诚的努力，也需要我们保持足够的耐心。让我们从今天开始，用心经营每一段关系，共同营造更加和谐美好的人际环境。";

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function renderStructured(r) {
  return `<div class="card">
    <div class="score-row"><span class="score" style="font-size:30px">文体识别</span></div>
    <div class="kv"><span>条目 / 结构化文本</span><b>编号或符号开头的行占 ${(r.formItemRatio * 100).toFixed(0)}%</b></div>
    <div class="sub">通知、纪要、清单、模板这类文体。</div>
  </div>
  <div class="card">
    <p>玉尺的呼吸分是给散文的。这类文本的“整齐”是文体要求，不是毛病——拿散文的尺量条目，量出来的高分不作数，低分也不算数。</p>
    <p>这一类该看的是：条目齐不齐、信息全不全、层级顺不顺。那是文体的规矩，不是呼吸。</p>
    <div class="sub">客观读数：${r.n} 句 / ${r.total} 字。文中的叙述段若想按散文量，单独摘出来再量。</div>
  </div>`;
}

function renderReport(r) {
  const L = [];
  L.push(`<div class="card">
    <div class="score-row"><span class="score">${r.score}</span>
      <span class="verdict">${verdict(r.score)}</span></div>
    <div class="sub">约超过 ${percentileOf(r.score)}% 的人类样本（按当前参考语料）</div>
    <div class="sub">大句 ${r.n} 句　平均 ${r.avg.toFixed(0)} 字　小句 ${r.nClause} 句</div>
    ${r.smallSample ? '<div class="sub" style="color:#a4553f">样本量偏小（不足百字），分数只作参考</div>' : ''}
  </div>`);

  L.push(`<div class="card"><h3>节 奏 层</h3>
    <div class="kv"><span>大句变异系数</span><b>${r.cv.toFixed(2)}</b></div>
    <div class="kv"><span>小句变异系数（句内呼吸）</span><b>${r.clauseCv.toFixed(2)}</b></div>
    <div class="kv"><span>最长平滑段</span><b>${r.flatN} 句（占 ${(r.flatPct * 100).toFixed(0)}%）</b></div>
    <div class="kv"><span>短句（≤12 字）</span><b>每 200 字 ${r.shortPer200.toFixed(1)} 句</b></div>
    <h3>句 长 节 奏 图</h3>`);
  const maxLen = Math.max(...r.lens, 1);
  r.lens.forEach((n, i) => {
    const w = Math.max(3, Math.round(n / maxLen * 300));
    const s = (r.sents[i] || "").slice(0, 18);
    L.push(`<div class="bar-row"><span class="idx">${i + 1}</span>
      <span class="bar" style="width:${w}px"><i style="width:100%"></i></span>
      <span class="len">${n}</span><span class="txt">${esc(s)}</span></div>`);
  });
  L.push(`</div>`);

  L.push(`<div class="card"><h3>密 度 层</h3>
    <div class="kv"><span>套话与连接词</span><b>${r.glueDensity.toFixed(1)} / 百字</b></div>
    ${r.glueHits.length ? `<div class="sub">命中：${r.glueHits.slice(0, 8).map(x => `「${x[0]}」×${x[1]}`).join("　")}</div>` : ""}
    <div class="kv"><span>破折号</span><b>${r.dash} 处（${r.dashDensity.toFixed(1)}/百字）</b></div>
    <div class="kv"><span>虚词与空夸词</span><b>${r.vagueDensity.toFixed(1)} / 百字</b></div>
    <h3>结 构 层</h3>
    <div class="kv"><span>列举词 ${r.enumN} 处　总结词 ${r.sumN} 处</span><b>${r.struct}</b></div>
  </div>`);

  if (r.paraCv !== null) {
    L.push(`<div class="card"><h3>段 落 层</h3>
      <div class="kv"><span>段落长度变异系数</span><b>${r.paraCv.toFixed(2)}</b></div>
      <div class="sub">${r.nPara} 段。越参差越像人写。</div></div>`);
  }

  L.push(`<div class="card"><h3>改 法（落到句，不给形容词）</h3>
    <ol class="tips">${makeTips(r).map(t => `<li>${esc(t)}</li>`).join("")}</ol></div>`);

  L.push(`<p class="kicker">玉尺不测 AI 率，只量呼吸。以上是节奏诊断，不是检测报告。</p>`);
  return L.join("");
}

function toTextReport(r, plain) {
  if (r.form === "structured") {
    return ["玉尺 · 文气诊断",
      `文体识别：条目 / 结构化文本（编号或符号开头的行占 ${(r.formItemRatio * 100).toFixed(0)}%）`,
      "玉尺的呼吸分是给散文的。这类文本的整齐是文体要求，不是毛病。",
      "这一类该看的是：条目齐不齐、信息全不全、层级顺不顺。"].join("\n");
  }
  const L = [];
  L.push(`玉尺 · 文气诊断`);
  L.push(`总评 ${r.score}/100 ${verdict(r.score)}`);
  L.push(`大句 ${r.n} 句 平均 ${r.avg.toFixed(0)} 字 变异系数 ${r.cv.toFixed(2)}`);
  L.push(`小句变异系数 ${r.clauseCv.toFixed(2)}　平滑段 ${r.flatN} 句（${(r.flatPct * 100).toFixed(0)}%）`);
  L.push(`套话密度 ${r.glueDensity.toFixed(1)}/百字　结构：${r.struct}`);
  L.push("改法：");
  makeTips(r).forEach((t, i) => L.push(`${i + 1}. ${t}`));
  return L.join("\n");
}

let lastReport = "";
let mode = "prose";
document.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => {
  mode = b.dataset.mode;
  document.querySelectorAll(".mode").forEach(x => x.classList.toggle("on", x === b));
  $("result").innerHTML = "";
  $("copy").style.display = "none";
}));
$("run").addEventListener("click", () => {
  const t = $("text").value.trim();
  if (!t) { $("text").focus(); return; }
  if (mode === "poem") {
    const r = analyzePoem(t);
    $("result").innerHTML = renderPoemReport(r);
    lastReport = toPoemText(r);
  } else {
    if (hanzi(t) < 50) {
      $("result").innerHTML = `<div class="card"><p class="sub">文本太短（不足五十个汉字），节奏量不出来——多写几段再量。</p></div>`;
      lastReport = "";
      $("copy").style.display = "none";
      return;
    }
    const r = analyze(t);
    r.smallSample = hanzi(t) < 100;
    $("result").innerHTML = r.form === "structured" ? renderStructured(r) : renderReport(r);
    lastReport = toTextReport(r);
  }
  $("copy").style.display = "inline-block";
});
$("demo").addEventListener("click", () => {
  $("text").value = DEMO;
  $("run").click();
});
if (location.hash === "#demo") $("demo").click();
const POEM_DEMO = "雨停在半空\n瓦片亮了一下\n巷子深处的猫叫，拖得很长\n\n我把伞收起来\n又撑开\n像一句没说出口的话";
if (location.hash === "#poem") {
  document.querySelector('.mode[data-mode="poem"]').click();
  $("text").value = POEM_DEMO;
  $("run").click();
}
$("copy").addEventListener("click", async () => {
  if (!lastReport) return;
  try { await navigator.clipboard.writeText(lastReport); $("copy").textContent = "已复制"; }
  catch (e) { $("copy").textContent = "复制失败"; }
  setTimeout(() => { $("copy").textContent = "复制报告"; }, 1500);
});
